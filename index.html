<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow - Live TV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <div class="logo">
                <i class="fa-solid fa-play-circle"></i>
                <span>StreamFlow</span>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search channels, countries, or languages...">
            </div>
        </header>

        <main class="main-content">
            <section class="player-section">
                <div class="video-container" id="videoContainer">
                    <video id="video" controls crossorigin="anonymous"></video>
                    <div class="placeholder-overlay" id="playerPlaceholder">
                        <i class="fa-solid fa-tv"></i>
                        <p>Select a channel to start streaming</p>
                    </div>
                </div>
                <div class="current-channel-info" id="channelInfo">
                    <h2 id="currentChannelName">No Channel Selected</h2>
                    <p id="currentChannelGroup">Select a channel from the list below</p>
                </div>
            </section>

            <section class="channels-section">
                <div class="channels-header">
                    <h3>Live Channels</h3>
                    <div class="filter-stats">
                        <span id="channelCount">0 channels</span>
                    </div>
                </div>
                <div class="channels-grid" id="channelsGrid">
                    <!-- Channels will be injected here -->
                    <div class="loading-spinner" id="loadingSpinner">
                        <div class="spinner"></div>
                        <p>Loading channels...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
